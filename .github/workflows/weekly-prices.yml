name: Weekly price check
on:
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC (09:00 Cairo)
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: weekly-prices, cancel-in-progress: false }
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - id: run
        run: node scripts/update-prices.mjs data.json
      - name: Commit if changed
        if: steps.run.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || { git commit -m "weekly price check $(date -u +%F): ${{ steps.run.outputs.summary }}" && git push; }
